<!DOCTYPE html>
<html lang="en">
<!--
  ═══════════════════════════════════════════════════════════════════
  FPV // STRIKE — prototype v0.2
  ═══════════════════════════════════════════════════════════════════
  Top-down 3D kamikaze-approach game. This file is only the shell:
  markup, CSS, and the import map. The code lives in ES modules —
  no bundler, the browser loads them directly:

    config.js   CFG — every tunable number (the tuning surface)
    levels.js   level definitions + world builders (boxes/houses/groves)
    game.js     engine: entities, AI, particles, input, HUD, main loop

  RULES
  - You are an FPV drone. No weapons — only the explosion.
  - HOLD your finger: joystick flight. RELEASE: detonate. The only
    way to disengage is to commit.
  - You also explode if a bullet hits you or you clip an obstacle.
  - STRIKE levels: any explosion with the enemy inside your blast
    radius = level complete. Even death can be a win.
  - INTERCEPT levels: chase the Shahed down a corridor and detonate
    under it before it reaches the city.
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FPV // STRIKE</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#000; overflow:hidden; height:100%;
  font-family:'Courier New',monospace; touch-action:none;
  -webkit-user-select:none; user-select:none; }
canvas { display:block; }
#overlay { position:absolute; top:0; left:0; pointer-events:none; }

#hud { position:absolute; inset:0; pointer-events:none; }
#status {
  position:absolute; top:20px; left:22px;
  color:rgba(0,210,255,0.6); font-size:10px;
  letter-spacing:3px; line-height:2.1;
}
#flash {
  position:absolute; top:42%; left:50%;
  transform:translate(-50%,-50%);
  font-size:clamp(14px,3vw,26px);
  letter-spacing:7px; text-transform:uppercase;
  text-align:center; opacity:0;
  transition:opacity 0.25s;
  text-shadow:0 0 26px currentColor;
  white-space:nowrap;
}
#flash.on { opacity:1; }
#hint {
  position:absolute; bottom:7%; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,0.4); font-size:11px; letter-spacing:3px;
  text-transform:uppercase; text-align:center; line-height:2;
  transition:opacity 0.4s;
}
#hint.off { opacity:0; }
#corner {
  position:absolute; bottom:14px; right:16px;
  color:rgba(255,255,255,0.13); font-size:9px; letter-spacing:3px;
}

/* ── MENU ── the only DOM that takes input; the canvas ignores
   pointers while this is open (see game.js state gating) ── */
#menu {
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px;
  background:rgba(0,2,6,0.86);
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  transition:opacity 0.3s;
}
#menu.off { opacity:0; pointer-events:none; }
#menu h1 {
  color:rgba(0,210,255,0.85); font-size:clamp(20px,5vw,34px);
  letter-spacing:10px; font-weight:400; margin-bottom:4px;
}
#menu .sub {
  color:rgba(255,255,255,0.35); font-size:10px;
  letter-spacing:4px; text-transform:uppercase; margin-bottom:22px;
}
#levelList { display:flex; flex-direction:column; gap:12px; }
.lvl {
  width:min(78vw,340px);
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(0,210,255,0.25);
  border-radius:10px; padding:14px 18px;
  color:rgba(255,255,255,0.9); font-family:inherit;
  font-size:13px; letter-spacing:2px; text-align:left;
  cursor:pointer; transition:background 0.15s, border-color 0.15s;
}
.lvl:active { background:rgba(0,210,255,0.16); border-color:rgba(0,210,255,0.6); }
.lvl .n { font-size:9px; color:rgba(0,210,255,0.6); letter-spacing:3px; }
.lvl .d { font-size:9px; color:rgba(255,255,255,0.4); letter-spacing:1px;
          margin-top:5px; line-height:1.6; text-transform:uppercase; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="overlay"></canvas>

<div id="hud">
  <div id="status">
    <div id="sLine1"></div>
    <div id="sLine2" style="opacity:.5"></div>
    <div id="sLine3" style="opacity:.5"></div>
  </div>
  <div id="flash"></div>
  <div id="hint">TOUCH AND HOLD TO LAUNCH<br>RELEASE TO DETONATE</div>
  <div id="corner">FPV//STRIKE v0.2</div>
</div>

<!-- Level select. Buttons are generated by game.js from levels.js -->
<div id="menu">
  <h1>FPV // STRIKE</h1>
  <div class="sub">Select mission</div>
  <div id="levelList"></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"}}
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
